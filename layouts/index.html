{{ define "main" }}
<div class="grid grid-cols-1 md:grid-cols-5 gap-2 py-2 md:items-start">
  <div class="col-span-2 md:sticky md:top-0 md:self-start">
    <div class="bg-warm-100 dark:bg-darker drop-shadow-md p-2 rounded-t-lg">
      <div class="flex flex-col justify-center">
        {{ partial "profilePhoto" . }}
        <div class="px-2 text-center">{{ partial "social" . }}</div>
      </div>
    </div>
    {{ partial "footer" . }}
  </div>
  <div class="accordion-column col-span-3 md:sticky md:top-0 md:self-start overflow-y-auto" style="max-height: calc(100vh - 6rem)">
    {{ $found_expanded := false }}
    {{ range .Site.Params.accordion }}
    <div class="px-2">
      <h2 class="accordion {{- if and (.expand) (not $found_expanded) }} active {{- $found_expanded = true }} {{- end }}">
        {{ $current := index hugo.Data .item }}
        <p onclick="expandAccordion(this)" style="cursor: pointer">
          <i class="{{ $current.icon }}"></i>
          {{ $current.title -}}
        </p>
      </h2>

      <div
        class="panel overflow-hidden px-2 ml-2 w-full min-w-0"
        {{ if .panel_id }}
        id="{{ .panel_id }}"
        {{ end }}
      >
        <div class="">{{ partial (print "accordion/" .item) $ }}</div>
      </div>
    </div>
    {{ end }}
  </div>
</div>
{{ end }}

<header
  class="nav flex flex-row row py-2 mb-6 w-full border-b border-warm-200 dark:border-gray-700 justify-between"
>
  <div class="flex gap-4">
    <a class="nav-menu-item" href="{{ .Site.BaseURL }}">Home</a>
  </div>
  <div>
    <i
      class="bi bi-brightness-high theme-toggle text-warm-500 hover:text-warm-600 dark:text-gold-300 dark:hover:text-gold-500 cursor-pointer text-lg mr-9 sm:mr-0"
      onclick="toggleTheme()"
      onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();toggleTheme()}"
      role="button"
      tabindex="0"
      aria-label="Toggle colour theme"
    ></i>
  </div>
</header>

{{ partial "toggleTheme.html" . }}

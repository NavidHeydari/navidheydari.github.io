<footer class="text-sm text-center border-t border-warm-200 dark:border-gray-600 {{ if .IsHome }} bg-warm-100 dark:bg-dark rounded-b-lg py-2 {{ else }} py-6 {{ end }}">
  <p>{{ .Site.Params.copyright | markdownify }}</p>

  {{ if .Site.Params.theme.singlePage }}
  <i
    class="bi bi-brightness-high theme-toggle text-warm-500 hover:text-warm-600 dark:text-gold-300 dark:hover:text-gold-500 cursor-pointer text-lg mr-9 sm:mr-0"
    onclick="toggleTheme()"
  ></i>
  {{ partial "toggleTheme.html" . }}
  {{ end }}
</footer>
